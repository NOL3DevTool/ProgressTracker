<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>iPhone 18 Monitoring Progress</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b1f24;--mut:#6b7280;--bd:#e3e6ea;--ac:#ee4d2d;--ok:#16a34a;--warn:#d97706;--bar:#e5e7eb}
@media(prefers-color-scheme:dark){:root{--bg:#14161a;--card:#1d2026;--tx:#e8eaed;--mut:#9aa1ab;--bd:#2d3139;--bar:#2d3139}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,sans-serif;padding:16px;max-width:1300px;margin:auto}
h1{font-size:22px;margin:0}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.mut{color:var(--mut);font-size:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px}
.bar{height:14px;background:var(--bar);border-radius:7px;overflow:hidden;position:relative}
.bar>i{display:block;height:100%;background:var(--ok)}
.bar.arr>i{background:var(--warn)}
.row{display:flex;justify-content:space-between;margin:8px 0 4px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{background:var(--bar);border-radius:12px;padding:2px 9px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;margin:12px 0}
.grid .card{cursor:pointer}.grid .card.sel{outline:2px solid var(--ac)}
.grid h3{margin:0 0 4px;font-size:15px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 8px}
input,select{font:inherit;padding:5px 7px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--tx)}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;background:var(--card);border:1px solid var(--bd)}
th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--mut);position:sticky;top:0;background:var(--card)}
td input[type=text]{width:140px}
#sync{font-size:12px;padding:2px 8px;border-radius:10px;background:var(--bar)}
#err{color:#dc2626;margin:8px 0}
</style>
</head>
<body>
<header>
  <h1>iPhone 18 Monitoring Progress</h1>
  <div><span id="sync">Loading…</span> <span class="mut" id="upd"></span></div>
</header>
<div id="err"></div>
<div class="card" id="total"></div>
<div class="grid" id="stations"></div>
<div class="tools">
  <input id="q" placeholder="Search Order ID / CP# / rider">
  <select id="fs"><option value="">All stations</option></select>
  <select id="fst"><option value="">All statuses</option></select>
</div>
<div class="wrap"><table>
<thead><tr><th>Order ID</th><th>Station</th><th>Buyer CP#</th><th>System status</th><th>Actual Status</th><th>HVI OpEx Tracker Inbound</th><th>Rider Assigned</th><th>POD Link</th></tr></thead>
<tbody id="rows"></tbody></table></div>
<div class="mut" id="cap" style="margin-top:6px"></div>

<script>
/* ===== CONFIG ===== */
const CFG = {
  SHEET_ID: '1QguC1fliOyD4Z5nIscYQ8686k59n8F3T-bMhT_UL9dg',
  WORKER_URL: 'https://iphone18-monitoring.YOUR-SUBDOMAIN.workers.dev', // <- your Worker URL
  NOL3_FILTER: 'NOL3',   // matched against Subregion; '' = no filter
  REFRESH_MS: 20000,
  MAX_ROWS: 300
};
const STATUSES = ['LMHub_Received','LMHub_Assigning','LMHub_Assigned','Delivering','Delivered','Onhold'];
const F = { // each field accepts the raw column name or the display label
  soc:['mece_soc_assignment','SOC Assignment'], pSub:['projected_delivery_subregion','Subregion'],
  pHub:['projected_delivery_hub','Delivery Station'], cnt:['count order_sn','Total Count'],
  oid:['shipment_id','Order ID'], aSub:['dest_subregion','Subregion'],
  stn:['dest_station_name','Destination Station'], cur:['current_stage','Current Station'],
  cp:['buyer_phone','Buyer CP#']
};
/* ================== */
const $ = id => document.getElementById(id);
const norm = s => String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let pre=[], ord=[], manual={}, sel='';

function parseCSV(t){const r=[];let row=[],c='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch=='"')q=true; else if(ch==',')row.push(c),c='';
    else if(ch=='\n'){row.push(c);r.push(row);row=[];c=''} else if(ch!='\r')c+=ch}
  if(c||row.length){row.push(c);r.push(row)} return r}

async function loadSheet(name, keyAliases){
  const u=`https://docs.google.com/spreadsheets/d/${CFG.SHEET_ID}/gviz/tq?tqx=out:csv&headers=0&sheet=${encodeURIComponent(name)}`;
  const res=await fetch(u); if(!res.ok) throw new Error(name+': HTTP '+res.status);
  const rows=parseCSV(await res.text());
  const keys=keyAliases.map(norm);
  let h=rows.findIndex(r=>r.some(x=>keys.includes(norm(x))));
  if(h<0) h=2; // fallback: row 3
  const head=rows[h].map(norm);
  return rows.slice(h+1).filter(r=>r.some(x=>x&&x.trim())).map(r=>{
    const o={};for(const k in F){const i=head.findIndex(x=>F[k].map(norm).includes(x)); o[k]=i>=0?(r[i]||'').trim():''} return o});
}

function detectStatus(cur){const n=norm(cur);return STATUSES.find(s=>n.includes(norm(s)))||null}

function compute(){
  const f=norm(CFG.NOL3_FILTER);
  let P=pre, O=ord;
  if(f){const p2=P.filter(r=>norm(r.pSub).includes(f)),o2=O.filter(r=>norm(r.aSub).includes(f));
    if(p2.length||o2.length){P=p2;O=o2}}
  const st={}; const get=n=>st[norm(n)]||(st[norm(n)]={name:n,target:0,arrived:0,delivered:0,by:{}});
  P.forEach(r=>{if(r.pHub)get(r.pHub).target+=parseInt((r.cnt||'0').replace(/,/g,''))||0});
  const list=[];
  O.forEach(r=>{
    if(!r.oid||!r.stn)return;
    const s=get(r.stn), cs=norm(r.cur), sys=detectStatus(r.cur);
    const inStn=cs.includes(norm(r.stn))||(sys&&cs===norm(sys));
    const m=manual[r.oid]||{};
    const sysStatus=inStn?(sys||'LMHub_Received'):null;
    const eff=STATUSES.includes(m.actualStatus)?m.actualStatus:sysStatus;
    const row={...r,station:s.name,sysStatus,eff,inStn:!!eff};
    if(row.inStn){s.arrived++;s.by[eff]=(s.by[eff]||0)+1;if(eff==='Delivered')s.delivered++}
    list.push(row)});
  return {st:Object.values(st).sort((a,b)=>a.name.localeCompare(b.name)),list};
}

const pct=(a,b)=>b?Math.min(100,a/b*100):0;
function block(title,s,big){
  const by=s.by||{};
  return `<div class="row"><span>${big?'':''}${esc(title)}</span><span>${pct(s.delivered,s.target).toFixed(1)}% delivered</span></div>
  <div class="bar"><i style="width:${pct(s.delivered,s.target)}%"></i></div>
  <div class="row" style="font-weight:400"><span class="mut">Arrived in station</span><span class="mut">${pct(s.arrived,s.target).toFixed(1)}% (${s.arrived}/${s.target})</span></div>
  <div class="bar arr"><i style="width:${pct(s.arrived,s.target)}%"></i></div>
  <div class="chips"><span class="chip"><b>${s.delivered}</b> / ${s.target} delivered</span>
  ${STATUSES.map(k=>`<span class="chip">${k}: <b>${by[k]||0}</b></span>`).join('')}</div>`}

let model;
function render(){
  model=compute();
  const T={target:0,arrived:0,delivered:0,by:{}};
  model.st.forEach(s=>{T.target+=s.target;T.arrived+=s.arrived;T.delivered+=s.delivered;for(const k in s.by)T.by[k]=(T.by[k]||0)+s.by[k]});
  $('total').innerHTML=block('NOL3 Total',T,true);
  $('stations').innerHTML=model.st.map(s=>`<div class="card ${sel===s.name?'sel':''}" data-s="${esc(s.name)}"><h3>${esc(s.name)}</h3>${block('',s)}</div>`).join('');
  const cur=$('fs').value;
  $('fs').innerHTML='<option value="">All stations</option>'+model.st.map(s=>`<option ${s.name===cur?'selected':''}>${esc(s.name)}</option>`).join('');
  if(!$('fst').options[1])$('fst').innerHTML='<option value="">All statuses</option><option value="_none">Not yet in station</option>'+STATUSES.map(s=>`<option>${s}</option>`).join('');
  renderRows();
}
function renderRows(){
  const q=norm($('q').value),fs=$('fs').value,fst=$('fst').value;
  let L=model.list.filter(r=>(!fs||r.station===fs)&&(!fst||(fst==='_none'?!r.eff:r.eff===fst))
    &&(!q||norm(r.oid+r.cp+(manual[r.oid]?.rider||'')).includes(q)));
  const total=L.length; L=L.slice(0,CFG.MAX_ROWS);
  $('rows').innerHTML=L.map(r=>{const m=manual[r.oid]||{};
    const opt=(arr,v)=>arr.map(x=>`<option ${x===v?'selected':''} value="${x}">${x||'—'}</option>`).join('');
    return `<tr data-id="${esc(r.oid)}"><td>${esc(r.oid)}</td><td>${esc(r.station)}</td><td>${esc(r.cp)}</td><td>${esc(r.sysStatus||'Not in station')}</td>
    <td><select data-f="actualStatus">${opt(['',...STATUSES],m.actualStatus||'')}</select></td>
    <td><select data-f="hvi">${opt(['','Yes','No'],m.hvi||'')}</select></td>
    <td><input type="text" data-f="rider" value="${esc(m.rider||'')}"></td>
    <td><input type="text" data-f="pod" value="${esc(m.pod||'')}" placeholder="https://">${m.pod&&/^https?:/.test(m.pod)?` <a href="${esc(m.pod)}" target="_blank" rel="noopener">open</a>`:''}</td></tr>`}).join('');
  $('cap').textContent=`Showing ${L.length} of ${total} orders${total>L.length?' — use search/filters to narrow':''}`;
}

/* ---- Cloudflare sync ---- */
const timers={};
function save(id,field,val){
  manual[id]={...(manual[id]||{}),[field]:val};
  $('sync').textContent='Saving…';
  clearTimeout(timers[id]);
  timers[id]=setTimeout(async()=>{
    try{const r=await fetch(`${CFG.WORKER_URL}/api/orders/${encodeURIComponent(id)}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(manual[id])});
      if(!r.ok)throw 0; $('sync').textContent='Synced ✓'; render();}
    catch{$('sync').textContent='Save failed ✗'}},600);
}
async function pullState(){
  const r=await fetch(CFG.WORKER_URL+'/api/state',{cache:'no-store'}); if(!r.ok)throw new Error('Worker HTTP '+r.status);
  const s=await r.json();
  Object.keys(s).forEach(k=>{if(!timers[k]||!document.activeElement||!document.activeElement.closest('tr[data-id="'+CSS.escape(k)+'"]'))manual[k]=s[k]});
}
async function refresh(){
  const editing=document.activeElement&&/INPUT|SELECT/.test(document.activeElement.tagName)&&document.activeElement.closest('tr');
  try{
    $('err').textContent='';
    const [p,o]=await Promise.all([loadSheet('Preorders',F.pHub),loadSheet('Actual Orders',F.oid)]);
    pre=p;ord=o;
    try{await pullState();$('sync').textContent='Live ✓'}catch(e){$('sync').textContent='Sync offline';$('err').textContent='Cloudflare sync unavailable: '+e.message}
    if(!editing)render();else{ // update bars only, leave the table being edited
      model=compute();render()}
    $('upd').textContent='Updated '+new Date().toLocaleTimeString();
  }catch(e){$('err').textContent='Could not load Google Sheet ('+e.message+'). Make sure it is shared as "Anyone with the link – Viewer".'}
}

document.addEventListener('change',e=>{const tr=e.target.closest('tr[data-id]');if(tr&&e.target.dataset.f)save(tr.dataset.id,e.target.dataset.f,e.target.value.trim())});
$('stations').addEventListener('click',e=>{const c=e.target.closest('[data-s]');if(!c)return;sel=sel===c.dataset.s?'':c.dataset.s;$('fs').value=sel;render()});
['q','fs','fst'].forEach(i=>$(i).addEventListener('input',renderRows));
refresh();setInterval(refresh,CFG.REFRESH_MS);
</script>
</body>
</html>
